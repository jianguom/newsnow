name: Sync upstream and deploy

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/newsnext/newsnow.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin HEAD:main
          if [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.merge.outputs.changed == 'true'
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.changed == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.merge.outputs.changed == 'true'
        run: pnpm run build
        env:
          CF_PAGES: '1'

      - name: Deploy to Cloudflare Pages
        if: steps.merge.outputs.changed == 'true'
        run: pnpm exec wrangler pages deploy dist/output/public --project-name newsnow --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
